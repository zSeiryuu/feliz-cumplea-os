<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa mi amor</title>
    <!-- Fuente amigable y moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            /* --- IMAGEN DE FONDO RESPONSIVE --- */
            background-image: url('imagenes/dreamstime_m_278262954.jpeg'); 
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Capa translúcida para suavizar el fondo de lirios */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.35); 
            z-index: 1;
        }

        /* --- PARTÍCULAS RÁPIDAS Y DINÁMICAS EN EL FONDO --- */
        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2; 
            pointer-events: none; 
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(186, 150, 230, 0.9), 0 0 18px rgba(255, 255, 255, 0.8);
            animation: floatParticle linear infinite;
        }

        .particle:nth-child(1)  { width: 8px;  height: 8px;  left: 5%;  animation-duration: 3.5s; animation-delay: 0s; }
        .particle:nth-child(2)  { width: 12px; height: 12px; left: 15%; animation-duration: 2.8s; animation-delay: 1.2s; }
        .particle:nth-child(3)  { width: 6px;  height: 6px;  left: 25%; animation-duration: 4.0s; animation-delay: 0.5s; }
        .particle:nth-child(4)  { width: 10px; height: 10px; left: 35%; animation-duration: 3.2s; animation-delay: 1.8s; }
        .particle:nth-child(5)  { width: 9px;  height: 9px;  left: 45%; animation-duration: 2.5s; animation-delay: 0.2s; }
        .particle:nth-child(6)  { width: 13px; height: 13px; left: 55%; animation-duration: 3.8s; animation-delay: 1.5s; }
        .particle:nth-child(7)  { width: 7px;  height: 7px;  left: 65%; animation-duration: 2.9s; animation-delay: 0.9s; }
        .particle:nth-child(8)  { width: 11px; height: 11px; left: 75%; animation-duration: 3.4s; animation-delay: 2.1s; }
        .particle:nth-child(9)  { width: 8px;  height: 8px;  left: 85%; animation-duration: 2.6s; animation-delay: 0.4s; }
        .particle:nth-child(10) { width: 10px; height: 10px; left: 93%; animation-duration: 3.6s; animation-delay: 1.1s; }

        @keyframes floatParticle {
            0% {
                transform: translateY(105vh) scale(0.4);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }

        /* --- TARJETA PRINCIPAL AMPLIA --- */
        .card {
            background: #ffffffd0; 
            border: 3.5px solid #4a3c63; 
            border-radius: 35px;
            width: 94%;
            max-width: 820px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18); 
            position: relative;
            z-index: 3; 
        }

        /* --- TÍTULO PRINCIPAL --- */
        h1 {
            color: #5d3d8a; 
            font-size: 2.6rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: fadeInDown 1.2s ease-out forwards, brilloYMovimiento 2s ease-in-out infinite alternate;
        }

        /* --- SUBTÍTULO --- */
        p.subtitle {
            color: #6a538f; 
            font-size: 1.5rem;
            margin-bottom: 40px;
            font-weight: 700;
            animation: fadeInUp 1.2s ease-out forwards, movimientoSuave 3s ease-in-out infinite alternate;
            animation-delay: 0.3s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* --- CONTENEDOR DE LAS CARDS --- */
        .grid-cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            animation: fadeIn 1.5s ease-out forwards;
            animation-delay: 0.5s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* --- 4 TARJETAS INTERIORES CON IMAGEN QUE OCUPA TODO --- */
        .mini-card {
            background: #ffffff;
            border: 4.5px solid #5d3d8a; 
            border-radius: 28px;
            width: 160px; 
            height: 160px; 
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(93, 61, 138, 0.22);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden; /* Esto asegura que la imagen no se salga de los bordes redondeados */
        }

        .mini-card img {
            width: 100%;  /* Ocupa todo el ancho de la card */
            height: 100%; /* Ocupa todo el alto de la card */
            object-fit: cover; /* Ajusta la imagen para cubrir el espacio sin deformarse */
            transition: transform 0.4s ease;
        }

        /* Efecto Hover potente: zoom suave en la imagen que llena la tarjeta */
        .mini-card:hover {
            border-color: #7e5fbf;
            transform: translateY(-8px) scale(1.06);
            box-shadow: 0 14px 32px rgba(126, 95, 191, 0.45);
        }

        .mini-card:hover img {
            transform: scale(1.12); /* Efecto de acercamiento elegante al pasar el mouse */
        }

        .mini-card:active {
            transform: translateY(-2px) scale(1);
        }

        /* --- ANIMACIONES DE ENTRADA Y EFECTOS --- */
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(25px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes brilloYMovimiento {
            0% {
                transform: scale(1);
                text-shadow: 0 0 5px rgba(186, 150, 230, 0.4), 0 0 10px rgba(186, 150, 230, 0.2);
            }
            100% {
                transform: scale(1.03); 
                text-shadow: 0 0 18px rgba(126, 95, 191, 0.9), 0 0 30px rgba(186, 150, 230, 0.8), 0 0 40px rgba(210, 180, 255, 0.6);
            }
        }

        @keyframes movimientoSuave {
            0% {
                transform: translateY(0);
                text-shadow: 0 0 3px rgba(106, 83, 143, 0.2);
            }
            100% {
                transform: translateY(-3px);
                text-shadow: 0 0 10px rgba(142, 124, 195, 0.6);
            }
        }
    </style>
</head>
<body>

    <!-- Partículas rápidas y dinámicas en el fondo -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Tarjeta Principal Amplia -->
    <div class="card">
        <!-- Títulos grandes con tono violeta, brillo y movimiento -->
        <h1>Sorpresaaa mi amoor!!!!</h1>
        <p class="subtitle">Haz click en cada uno</p>

        <!-- Cuadrícula con las 4 tarjetas y sus imágenes cubriendo todo -->
        <div class="grid-cards">
            <!-- Card 1: Lirio Blanco (Palabras) -->
            <a href="pagina1.html" class="mini-card">
                <img src="imagenes/images-Photoroom.png" alt="Lirio Blanco">
            </a>
            <!-- Card 2: Lirio Violeta (Playlist) -->
            <a href="pagina2.html" class="mini-card">
                <img src="imagenes/delicada-pintura-acuarela-de-dos-lirios-rosados-y-violetas-con-una-flor-lirio-en-caos-hermosa-cuenta-pétalos-delicados-color-rosa-398201504.jpg" alt="Lirio Violeta">
            </a>
            <!-- Card 3: Lirio Naranja (Fotos) -->
            <a href="pagina3.html" class="mini-card">
                <img src="imagenes/Orange-Lily-watercolor-flowers-clipart-Graphics-70633458-2-580x386.jpg" alt="Lirio Naranja">
            </a>
            <!-- Card 4: Lirio Púrpura (Dedicatoria y Código Riot) -->
            <a href="pagina4.html" class="mini-card">
                <img src="imagenes/dreamstime_s_54316355.jpeg" alt="Lirio Amarillo">
            </a>
        </div>
    </div>

</body>
</html>

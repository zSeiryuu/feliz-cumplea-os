<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Fotos Favoritas - Lirio Violeta</title>
    <!-- Fuente amigable y moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            /* Mismo fondo de lirios */
            background-image: url('imagenes/dreamstime_m_278262954.jpeg'); 
            background-size: cover;          
            background-position: center;    
            background-repeat: no-repeat;    
            background-attachment: fixed;    
            
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Capa translúcida */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.38); 
            z-index: 1;
        }

        /* --- PARTÍCULAS DE FONDO --- */
        .particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 2; 
            pointer-events: none; 
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(186, 150, 230, 0.9), 0 0 18px rgba(255, 255, 255, 0.8);
            animation: floatParticle linear infinite;
        }

        .particle:nth-child(1)  { width: 8px;  height: 8px;  left: 5%;  animation-duration: 3.5s; animation-delay: 0s; }
        .particle:nth-child(2)  { width: 12px; height: 12px; left: 15%; animation-duration: 2.8s; animation-delay: 1.2s; }
        .particle:nth-child(3)  { width: 6px;  height: 6px;  left: 25%; animation-duration: 4.0s; animation-delay: 0.5s; }
        .particle:nth-child(4)  { width: 10px; height: 10px; left: 35%; animation-duration: 3.2s; animation-delay: 1.8s; }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0.4); opacity: 0; }
            15%, 85% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        /* --- TARJETA PRINCIPAL --- */
        .main-card {
            background: rgba(255, 255, 255, 0.94); 
            border: 4.5px solid #5d3d8a; 
            border-radius: 38px;
            width: 95%;
            max-width: 1020px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(93, 61, 138, 0.25); 
            position: relative;
            z-index: 3; 
            animation: fadeInScale 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* TÍTULO PRINCIPAL */
        h1 {
            color: #4a3c63; 
            font-size: 1.9rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* --- CONTENEDOR DE FOTOS ESTILO GALERÍA / POLAROID --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            align-items: center;
            justify-items: center;
        }

        /* Estilo base para cada foto tipo polaroid (ajustado en tamaño para que entren bien las 8) */
        .polaroid {
            background: white;
            padding: 8px 8px 18px 8px;
            border-radius: 6px;
            box-shadow: 0 6px 15px rgba(93, 61, 138, 0.15);
            transition: transform 0.3s ease, z-index 0.3s ease;
            width: 100%;
            max-width: 155px;
            position: relative;
        }

        .polaroid img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Pequeñas rotaciones aleatorias para dar el efecto de fotos esparcidas */
        .polaroid:nth-child(1) { transform: rotate(-4deg); }
        .polaroid:nth-child(2) { transform: rotate(3deg); }
        .polaroid:nth-child(3) { transform: rotate(-3deg); }
        .polaroid:nth-child(4) { transform: rotate(4deg); }
        
        .polaroid:nth-child(6) { transform: rotate(3deg); }
        .polaroid:nth-child(7) { transform: rotate(-4deg); }
        .polaroid:nth-child(8) { transform: rotate(2deg); }
        .polaroid:nth-child(9) { transform: rotate(-3deg); }

        .polaroid:hover {
            transform: scale(1.08) rotate(0deg) !important;
            z-index: 10;
            box-shadow: 0 10px 22px rgba(93, 61, 138, 0.3);
        }

        /* Personaje central / decorativo */
        .center-character {
            grid-column: span 4;
            display: flex;
            justify-content: center;
            margin: -4px 0;
        }

        .center-character img {
            width: 90px;
            height: auto;
            animation: movimientoSuave 3s ease-in-out infinite alternate;
        }

        /* --- BOTÓN DE REGRESO --- */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 22px;
            background: #5d3d8a;
            color: white;
            text-decoration: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(93, 61, 138, 0.3);
            transition: all 0.3s ease;
            z-index: 5;
        }

        .back-btn:hover {
            background: #7e5fbf;
            transform: scale(1.12) rotate(10deg);
        }

        /* --- BOTÓN DE SIGUIENTE PÁGINA --- */
        .next-page-btn {
            position: absolute;
            top: 20px;
            left: 22px;
            background: #5d3d8a;
            color: white;
            text-decoration: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(93, 61, 138, 0.3);
            transition: all 0.3s ease;
            z-index: 5;
        }

        .next-page-btn:hover {
            background: #7e5fbf;
            transform: scale(1.12) rotate(-10deg);
        }

        /* --- ANIMACIONES --- */
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes movimientoSuave {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* Responsive para celulares */
        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
            .center-character {
                grid-column: span 2;
            }
            .polaroid {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Partículas flotantes de fondo -->
    <div class="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Contenedor Principal -->
    <div class="main-card">
        <!-- Botón para ir a la página anterior -->
        

        <!-- Botón para volver al menú de los lirios -->
        <a href="cards.html" class="back-btn" title="Menú Principal">🏠</a>

        <h1>MIS FOTOS FAVORITAS (REALMENTE ME GUSTARON TODAS PERO NO ENTRABAN)</h1>

        <!-- Galería de fotos tipo Polaroid con personaje al centro -->
        <div class="gallery-container">
            <!-- Fila Superior (4 fotos) -->
            <div class="polaroid">
                <img src="fotos/1.jpeg" alt="Foto favorita 1">
            </div>
            <div class="polaroid">
                <img src="fotos/2.jpeg" alt="Foto favorita 2">
            </div>
            <div class="polaroid">
                <img src="fotos/3.jpeg" alt="Foto favorita 3">
            </div>
            <div class="polaroid">
                <img src="fotos/4.jpeg" alt="Foto favorita 4">
            </div>

            <!-- Personaje al centro de la galería -->
            <div class="center-character">
                <img src="imagenes/gato1.gif" alt="Pochacco decorativo">
            </div>

            <!-- Fila Inferior (4 fotos) -->
            <div class="polaroid">
                <img src="fotos/5.jpeg" alt="Foto favorita 5">
            </div>
            <div class="polaroid">
                <img src="fotos/6.jpeg" alt="Foto favorita 6">
            </div>
            <div class="polaroid">
                <img src="fotos/7.jpeg" alt="Foto favorita 7">
            </div>
            <div class="polaroid">
                <img src="fotos/8.jpeg" alt="Foto favorita 8">
            </div>
        </div>
    </div>

</body>
</html>
